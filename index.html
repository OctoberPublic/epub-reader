<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <!-- 全画面・ノッチ回避: viewport-fit=cover + safe-area-inset。ピンチズーム無効 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
  <title>EPUB Reader</title>

  <!-- iOS: ホーム画面追加で全画面スタンドアロン表示 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EPUB" />
  <meta name="theme-color" content="#121212" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- ライブラリ画面（本棚） -->
  <section id="library-view" class="screen">
    <header class="lib-header">
      <h1>ライブラリ</h1>
      <div class="lib-actions">
        <button id="folder-button" class="icon-button" aria-label="フォルダから取り込む" title="フォルダから取り込む(PC)">🗀</button>
        <button id="import-button" class="icon-button" aria-label="本を追加(複数可)" title="本を追加(複数選択可)">＋</button>
      </div>
    </header>
    <div id="book-grid" class="book-grid"></div>
    <div id="library-empty" class="empty-state" hidden>
      <p>まだ本がありません。</p>
      <button id="import-button-empty" class="primary-button">EPUB を追加</button>
    </div>
    <div id="storage-hint" class="storage-hint" hidden></div>
  </section>

  <!-- リーダー画面（Bibi を全画面 iframe で表示。bibiReader.js が挿入） -->
  <section id="reader-view" class="screen" hidden>
    <div id="bibi-surface" class="bibi-surface"></div>
    <button id="bibi-back" class="bibi-back" aria-label="ライブラリへ戻る" title="ライブラリへ戻る">‹ ライブラリ</button>
  </section>

  <div id="toast" class="toast" hidden></div>

  <!-- 複数選択(iPad/PC 共通)。folder-input はフォルダ再帰選択(PC のみ。iOS は multiple にフォールバック) -->
  <input id="file-input" type="file" accept=".epub,application/epub+zip" multiple hidden />
  <input id="folder-input" type="file" accept=".epub,application/epub+zip" webkitdirectory multiple hidden />

  <script type="module" src="./src/main.js"></script>
</body>
</html>
