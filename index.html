<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />

  <!-- Service Worker / キャッシュが壊れて真っ黒(本体が表示されない)になった時の自己回復用。
       ?reset-sw を付けて開くと、SW を登録解除し Cache を全削除してから通常URLで読み直す。
       本のデータ(IndexedDB)は消さないので、本棚はそのまま残る。 -->
  <script>
    (function () {
      if (location.search.indexOf('reset-sw') === -1) return
      var done = function () { location.replace(location.pathname) }
      Promise.resolve().then(async function () {
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations()
            await Promise.all(regs.map(function (r) { return r.unregister() }))
          }
          if (window.caches) {
            var keys = await caches.keys()
            await Promise.all(keys.map(function (k) { return caches.delete(k) }))
          }
        } catch (e) { /* 失敗しても読み直す */ }
        done()
      })
    })()
  </script>

  <!-- 全画面・ノッチ回避: viewport-fit=cover + safe-area-inset。ピンチズーム無効 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
  <title>EPUB Reader</title>

  <!-- iOS: ホーム画面追加で全画面スタンドアロン表示 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EPUB" />
  <meta name="theme-color" content="#121212" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- ライブラリ画面（本棚） -->
  <section id="library-view" class="screen">
    <header class="lib-header">
      <h1>ライブラリ</h1>
      <div class="lib-actions">
        <button id="search-toggle" class="icon-button" aria-label="検索" title="検索">⌕</button>
        <div class="lib-sort-wrap">
          <button id="sort-button" class="icon-button" aria-label="並び替え" title="並び替え" aria-haspopup="true" aria-expanded="false">▾</button>
          <div id="sort-menu" class="lib-menu" role="menu" hidden>
            <button class="lib-menu-item" role="menuitemradio" data-sort="recent">最近開いた順</button>
            <button class="lib-menu-item" role="menuitemradio" data-sort="name">名前順</button>
            <button class="lib-menu-item" role="menuitemradio" data-sort="added">追加順</button>
          </div>
        </div>
        <button id="favorite-filter" class="icon-button" aria-label="お気に入りだけ表示" title="お気に入りだけ表示" aria-pressed="false">♡</button>
        <button id="import-button" class="icon-button" aria-label="本を追加(複数可)" title="本を追加(複数選択可)">＋</button>
      </div>
    </header>
    <div id="search-bar" class="lib-search-bar" hidden>
      <input id="search-input" class="search-input" type="search" inputmode="search" autocomplete="off" placeholder="タイトル・著者で検索" aria-label="検索" />
      <button id="search-clear" class="search-clear" aria-label="クリア" hidden>×</button>
    </div>
    <div id="book-grid" class="book-grid"></div>
    <div id="library-empty" class="empty-state" hidden>
      <p>まだ本がありません。</p>
      <button id="import-button-empty" class="primary-button">EPUB を追加</button>
    </div>
    <div id="storage-hint" class="storage-hint" hidden></div>
    <div id="app-version" class="app-version"></div>
  </section>

  <!-- リーダー画面（Bibi を全画面 iframe で表示。bibiReader.js が挿入）。
       ライブラリへ戻る/見開き切替ボタンは Bibi のメニュー内に bibiReader.js が差し込む。
       #reader-escape は iframe の外に置く非常用の戻るボタン。Bibi が読み込めず白画面で
       固まった時でも必ず押せるよう、ロードが遅い時だけ自動表示する（bibiReader.js が制御）。 -->
  <section id="reader-view" class="screen" hidden>
    <div id="bibi-surface" class="bibi-surface"></div>
    <button id="reader-escape" class="reader-escape" type="button" aria-label="ライブラリへ戻る" hidden>×</button>
  </section>

  <div id="toast" class="toast" hidden></div>

  <!-- 複数選択(iPad/PC 共通)。フォルダを開いて中の EPUB を全選択すれば一括取り込みできる -->
  <input id="file-input" type="file" accept=".epub,application/epub+zip" multiple hidden />

  <script type="module" src="./src/main.js"></script>
</body>
</html>
